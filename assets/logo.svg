<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="cldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="cldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cldBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Circle stylized -->
    <circle cx="50" cy="50" r="46" fill="#F0FDF4" stroke="#15803D" stroke-width="2.5" />
    
    <!-- Sun of Hope / Dawn -->
    <path d="M 50 18 A 32 32 0 0 1 78 36 L 50 48 Z" fill="url(#cldGold)" opacity="0.85"/>
    <circle cx="50" cy="34" r="10" fill="url(#cldGold)"/>

    <!-- Two Embracing Leaves / Hands representing Livelihood & Community Growth -->
    <!-- Left Leaf / Community Foundation -->
    <path d="M 50 82 C 30 76 22 55 28 38 C 32 48 38 60 50 68 Z" fill="url(#cldGreen)"/>
    <!-- Right Leaf / Sustainable Growth -->
    <path d="M 50 82 C 70 76 78 55 72 38 C 68 48 62 60 50 68 Z" fill="#22C55E"/>

    <!-- Sprout stem & water drop base -->
    <path d="M 50 64 C 47 70 47 78 50 86 C 53 78 53 70 50 64 Z" fill="#047857"/>
    <circle cx="50" cy="88" r="3.5" fill="url(#cldBlue)" />

    <!-- Tiny human silhouette in unity -->
    <circle cx="50" cy="48" r="4" fill="#FFFFFF"/>
    <path d="M 43 60 C 43 54 57 54 57 60 Z" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(125, 26)">
    <!-- Acronym & Accent -->
    <text x="0" y="24" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="900" font-size="25" fill="#0F172A" letter-spacing="1.2">
      CLD <tspan fill="#15803D">KENYA</tspan>
    </text>
    
    <!-- Main Organization Name -->
    <text x="0" y="47" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#0F172A" letter-spacing="0.5">
      CENTER FOR LIVELIHOOD &amp; DEVELOPMENT
    </text>
    
    <!-- Subtitle / Location Tag -->
    <text x="0" y="67" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="600" font-size="11.5" fill="#64748B" letter-spacing="1.5">
      NAIROBI, KENYA &bull; EMPOWERING RESILIENT COMMUNITIES
    </text>

    <!-- Small decorative Kenyan flag colored bar -->
    <g transform="translate(0, 75)">
      <rect x="0" y="0" width="40" height="3" fill="#000000" rx="1.5"/>
      <rect x="42" y="0" width="40" height="3" fill="#BB0000" rx="1.5"/>
      <rect x="84" y="0" width="40" height="3" fill="#006600" rx="1.5"/>
    </g>
  </g>
</svg>
